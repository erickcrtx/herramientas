<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>Control de Herramientas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d5dbe1;
  --accent:#1f5f8b; --accent-ink:#ffffff; --out:#c26a00; --out-bg:#fff1dc; --in:#2e7d4f; --in-bg:#e2f3e8; --danger:#b3261e;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171d; --surface:#1b222b; --ink:#e6ebf0; --muted:#97a4b2; --line:#2c3642;
  --accent:#5aa3d6; --accent-ink:#0d1620; --out:#f0a443; --out-bg:#3a2a12; --in:#6cc58f; --in-bg:#163222; --danger:#f28b82; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:4px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.who{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px;max-width:260px}
.who label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px;border-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field>span b{color:var(--danger)}
.err{color:var(--danger);font-size:13px;font-weight:500;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
button{font:inherit;font-weight:600;border-radius:8px;padding:11px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.big{font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;padding:16px}
button.go-out{background:var(--out);border-color:var(--out);color:#fff}
button.go-in{background:var(--in);border-color:var(--in);color:#fff}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
button.link{border:0;background:none;color:var(--accent);padding:4px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.scanbox{display:flex;gap:8px}
.scanbox input{font-family:var(--f-mono);font-size:18px;letter-spacing:.04em;min-width:0}
.scanbox button{flex:0 0 auto}
.hint{font-size:13px;color:var(--muted);margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.in{color:var(--in);background:var(--in-bg)}
.pill.out{color:var(--out);background:var(--out-bg)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:0;border-top:1px solid var(--line);align-items:center;text-align:left;border-radius:0;background:none;width:100%;font-weight:400;color:var(--ink)}
.item:first-child{border-top:0}
button.item:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{grid-column:1/-1;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:13px}
.tag{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.tag .head{padding:14px 16px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag .head h3{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px 16px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.notes{white-space:pre-wrap}
.qr{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px dashed var(--line);flex-wrap:wrap}
.qr .code{background:#fff;padding:8px;border-radius:6px;line-height:0}
.qr .code img,.qr .code canvas{width:132px;height:132px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;width:100%}
.tabs button{border:0;background:none;border-radius:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat.o b{color:var(--out)}
.notice{background:var(--out-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--out) 40%,transparent);border-radius:10px;padding:10px 12px;font-size:14px}
.confirm{background:color-mix(in srgb,var(--danger) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lang{flex:0 0 auto;align-self:flex-end;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;padding:10px 12px}
.deptbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.deptbar>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;flex:0 0 auto}
.deptbar select{border:0;padding:8px 6px;font-weight:600;background:transparent}
.chip{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:6px;padding:1px 7px;margin-right:6px}
.warn{background:var(--out-bg);border:1px solid color-mix(in srgb,var(--out) 40%,transparent);border-radius:8px;padding:8px 10px;font-size:14px;margin:0}
#cam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:16px}
#cam #reader{width:100%;max-width:520px}
#cam button{background:#fff;color:#000}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Control de Herramientas<small>Salida y regreso con código de barras o QR</small></h1>
    <div class="who">
      <label for="activeProfile">¿Quién eres?</label>
      <select id="activeProfile"><option value="">Elige tu perfil</option></select>
      <span id="myDept" class="hint"></span>
    </div>
    <button id="langBtn" class="lang" type="button">EN</button>
  </header>
  <main id="view"></main>
</div>

<div class="tabs"><nav>
  <button data-tab="scan"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg><span>Escanear</span></button>
  <button data-tab="tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.4 1.4 0 0 0 2 2l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.4 2.4-2-.5-.5-2z"/></svg><span>Herramientas</span></button>
  <button data-tab="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5M16 5.5a3 3 0 0 1 0 5.6M18 14.5c1.6.6 2.7 2.2 3 4.5"/></svg><span>Perfiles</span></button>
  <button data-tab="log"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Historial</span></button>
</nav></div>
<div id="cam" hidden><div id="reader"></div><p style="color:#fff;margin:0">Apunta al código de barras o QR</p><button id="camClose">Cerrar cámara</button></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<div id="fileReader" hidden></div>

  const RX = [

    const m = String(s).match(/^(\s*)([\s\S]*?)(\s*)$/); const core = m[2];

      </div>
      ${result}
      ${S.people.length === 0 ? `<div class="notice">Primero crea los perfiles de tu equipo en la pestaña <b>Perfiles</b>.</div>` : ""}
      ${renderOutList()}
    </div>`;
    $("#scanForm").onsubmit = e => { e.preventDefault(); const c = norm($("#scanInput").value); if (c) { S.pending = c; render(); } };
    $("#camBtn").onclick = () => openCam("scan");
    $("#photoBtn").onclick = () => { photoTarget = "scan"; $("#photoInput").click(); };
    $("#regNew") && ($("#regNew").onclick = () => needAdmin(() => { S.editTool = {code:S.pending}; S.pending=null; render(); }));
    $("#cancelScan") && ($("#cancelScan").onclick = () => { S.pending = null; render(); });
    $("#doMove") && ($("#doMove").onclick = () => move(S.tools.find(x => norm(x.code) === S.pending)));
    bindItems(); bindDeptBar();
  }
  const deptChip = d => S.depts.length && !viewDept() ? `<span class="chip">${esc(deptLabel(d))}</span>` : "";
  function renderOutList(){
    const out = S.tools.filter(t => t.status === "out" && inView(t.dept)).sort((a,b)=>a.since-b.since);
    if (!out.length) return "";
    return `<h2>Fuera ahora</h2><div class="list">${out.map(t => `
      <button class="item" data-tool="${esc(t.id)}"><span class="t">${esc(t.name)}</span><span class="pill out">${since(t.since)}</span>
      <span class="s">${deptChip(t.dept)}${esc(t.holderName||personName(t.holderId)||"—")} · ${fmt(t.since)}</span></button>`).join("")}</div>`;
  }

  async function move(t){
    if (!t) return;
    const pid = activeId();
    if (!pid) { toast("Elige tu perfil arriba primero"); $("#activeProfile").focus(); return; }
    const btn = $("#doMove") || $("#quickMove"); if (btn) btn.disabled = true;
    const r = await act("move", t.id, pid, t.status === "out" ? "in" : "out");
    if (r) { toast((r.action === "in" ? "Regreso registrado · " : "Salida registrada · ") + fmt(r.at)); S.pending = null; S.toolId = null; }
    render();
  }

  /* ---------- cámara ---------- */
  let cam = null, camTarget = "scan";
  const FORMATS = () => window.Html5QrcodeSupportedFormats ? [
    "QR_CODE","CODE_128","CODE_39","CODE_93","EAN_13","EAN_8","UPC_A","UPC_E","ITF","CODABAR","DATA_MATRIX"
  ].map(f => Html5QrcodeSupportedFormats[f]).filter(v => v !== undefined) : undefined;
  async function openCam(target){
    camTarget = target;
    if (!window.Html5Qrcode) return toast("No se pudo cargar el lector. Usa la foto.");
    $("#cam").hidden = false;
    try {
      cam = new Html5Qrcode("reader", { formatsToSupport: FORMATS(), verbose: false });
      await cam.start({ facingMode: "environment" }, { fps: 10, qrbox: (w, h) => ({ width: Math.min(w, 320), height: Math.min(h, 200) }) },
        text => { closeCam(); gotCode(text); }, () => {});
    } catch(e) {
      closeCam();
      toast("La cámara no está disponible aquí. Usa “Tomar foto del código”.");
    }
  }
  async function closeCam(){ $("#cam").hidden = true; if (cam) { try { await cam.stop(); } catch(e){} try { cam.clear(); } catch(e){} cam = null; } }
  $("#camClose").onclick = closeCam;
  function gotCode(text){
    const c = codeFrom(text);
    if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){}
    if (camTarget === "scan") { S.pending = c; S.tab = "scan"; render(); }
    else { const i = $("#f-code"); if (i) i.value = c; toast("Código capturado"); }
  }

  /* ---------- foto -> código ---------- */
  let photoTarget = "scan";
  $("#photoInput").onchange = async e => {
    const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
    toast("Leyendo código…");
    let code = null;
    try { if ("BarcodeDetector" in window) { const r = await new BarcodeDetector().detect(await createImageBitmap(f)); code = r[0]?.rawValue || null; } } catch(_){}
    if (!code && window.Html5Qrcode) { try { const h = new Html5Qrcode("fileReader", { formatsToSupport: FORMATS(), verbose: false }); code = await h.scanFile(f, false); h.clear(); } catch(_){} }
    if (!code) return toast("No se encontró un código en la foto. Acércate y enfoca bien.");
    camTarget = photoTarget; gotCode(code);
  };

  /* ---------- herramientas ---------- */
  function renderTools(){
    const q = S.toolFilter.toLowerCase();
    const list = S.tools.filter(t => inView(t.dept) && (!q || [t.name,t.serial,t.code].some(v => String(v||"").toLowerCase().includes(q)))).sort(byName);
    view.innerHTML = `<div class="wrap">
      <div class="sectionhead"><h2>Herramientas</h2><button class="primary" id="addTool">+ Registrar</button></div>
      ${deptBar()}
      <input id="toolSearch" placeholder="Buscar por nombre, serie o código" value="${esc(S.toolFilter)}" aria-label="Buscar herramientas">
      ${S.tools.length === 0 ? `<div class="panel"><div class="empty"><strong>Aún no hay herramientas</strong>Toca “+ Registrar” para dar de alta la primera.</div></div>`
       : `<div class="list">${list.map(t => `<button class="item" data-tool="${esc(t.id)}"><span class="t">${esc(t.name)}</span>
          <span class="pill ${t.status==="out"?"out":"in"}">${t.status==="out"?"Fuera":"En su lugar"}</span>
          <span class="s">${deptChip(t.dept)}<span class="mono">S/N ${esc(t.serial)}</span>${t.status==="out" ? " · " + esc(t.holderName||personName(t.holderId)) : ""}</span></button>`).join("") || `<div class="empty">Sin herramientas en este departamento</div>`}</div>`}
    </div>`;
    $("#addTool").onclick = () => needAdmin(() => { S.editTool = { dept: viewDept() || myDept() }; render(); });
    const si = $("#toolSearch"); si.oninput = () => { S.toolFilter = si.value; const pos = si.selectionStart; renderTools(); const n = $("#toolSearch"); n.focus(); n.setSelectionRange(pos,pos); };
    bindItems(); bindDeptBar();
  }
  function bindItems(){ view.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { S.toolId = b.dataset.tool; S.confirmDel = null; render(); window.scrollTo(0,0); }); }

  function renderToolForm(){
    const t = S.editTool; const isNew = !t.id;
    view.innerHTML = `<form class="panel" id="toolForm" novalidate>
      <h2>${isNew ? "Registrar herramienta" : "Editar herramienta"}</h2>
      <label class="field"><span>Nombre de la herramienta <b>*</b></span><input id="f-name" value="${esc(t.name||"")}" placeholder="Ej. Taladro percutor DeWalt 20V"></label>
      ${S.depts.length ? `<label class="field"><span>Departamento <b>*</b></span><select id="f-dept">${deptOptions(t.dept ?? "")}</select></label>` : ""}
      <label class="field"><span>Número de serie <b>*</b></span><input id="f-serial" class="mono" value="${esc(t.serial||"")}" placeholder="Ej. 2134-87A9" autocapitalize="characters"></label>
      <div class="field"><span>Código de barras o QR</span>
        <div class="scanbox"><input id="f-code" class="mono" value="${esc(t.code||"")}" placeholder="Escanea la etiqueta o déjalo vacío"><button type="button" id="f-cam">📷</button></div>
        <span class="hint">Si lo dejas vacío, la app crea un código QR para imprimir y pegar en la herramienta.</span></div>
      <label class="field"><span>Notas</span><textarea id="f-notes" placeholder="Marca, modelo, accesorios, estado, ubicación en el estante…">${esc(t.notes||"")}</textarea></label>
      <p class="err" id="f-err" hidden></p>
      <div class="row"><button type="button" id="f-cancel">Cancelar</button><button class="primary" type="submit" id="f-save">${isNew?"Registrar":"Guardar cambios"}</button></div>
    </form>`;
    $("#f-cam").onclick = () => openCam("form");
    $("#f-cancel").onclick = () => { const id = t.id; S.editTool = null; S.toolId = id || null; render(); };
    $("#toolForm").onsubmit = async e => {
      e.preventDefault();
      const name = $("#f-name").value.trim(), serial = $("#f-serial").value.trim(), notes = $("#f-notes").value.trim(), code = norm($("#f-code").value);
      const err = $("#f-err");
      const dept = $("#f-dept") ? $("#f-dept").value : "";
      const miss = []; if (!name) miss.push("el nombre"); if (S.depts.length && !dept) miss.push("el departamento"); if (!serial) miss.push("el número de serie");
      if (miss.length) { err.textContent = "Falta " + miss.join(", ") + "."; err.hidden = false; (!name?$("#f-name"):(S.depts.length && !dept)?$("#f-dept"):$("#f-serial")).focus(); return; }
      $("#f-save").disabled = true;
      const r = await act("saveTool", {id: t.id || "", name, serial, code, notes, dept}, S.pin);
      if (r) { S.editTool = null; S.toolId = r.id; toast(isNew ? "Herramienta registrada" : "Cambios guardados"); render(); }
      else $("#f-save").disabled = false;
    };
    $("#f-name").focus();
  }

  function renderToolDetail(){
    const t = S.tools.find(x => x.id === S.toolId);
    if (!t) { S.toolId = null; return render(); }
    const isOut = t.status === "out";
    const hist = S.logs.filter(l => l.toolId === t.id).slice(0, 15);
    view.innerHTML = `<div class="wrap">
      <button class="link" id="back" style="align-self:flex-start">← Volver</button>
      <div class="tag">
        <div class="head"><h3>${esc(t.name)}</h3><span class="pill ${isOut?"out":"in"}">${isOut?"Fuera":"En su lugar"}</span></div>
        <dl class="kv">${S.depts.length ? `<dt>Depto.</dt><dd>${esc(deptLabel(t.dept))}</dd>` : ""}<dt>Serie</dt><dd class="mono">${esc(t.serial)}</dd><dt>Código</dt><dd class="mono">${esc(t.code)}</dd>
          ${isOut ? `<dt>La tiene</dt><dd>${esc(t.holderName||personName(t.holderId))}</dd><dt>Salió</dt><dd>${fmt(t.since)} · hace ${since(t.since)}</dd>` : ""}
          ${t.notes ? `<dt>Notas</dt><dd class="notes">${esc(t.notes)}</dd>` : ""}</dl>
        <div class="qr"><div class="code" id="qrBox"></div><div class="hint" style="flex:1 1 160px">Etiqueta QR de esta herramienta. Toma captura de pantalla para imprimirla y pegarla.<br><span class="mono">${esc(t.code)}</span></div></div>
      </div>
      ${!isOut && t.dept && myDept() && t.dept !== myDept() ? `<p class="warn">⚠ Esta herramienta es de <b>${esc(t.dept)}</b> y tú eres de <b>${esc(myDept())}</b>. Puedes llevarla, quedará registrado.</p>` : ""}
      <button class="big ${isOut?"go-in":"go-out"}" id="quickMove">${isOut?"Marcar regreso":"Marcar salida"}</button>
      <div class="row"><button id="editT">Editar</button><button class="danger" id="delT">Eliminar</button></div>
      ${S.confirmDel === t.id ? `<div class="confirm"><b>¿Eliminar “${esc(t.name)}”?</b><span class="hint">El historial anterior se conserva en la hoja.</span>
        <div class="row"><button id="delNo">No, conservar</button><button class="danger" id="delYes">Sí, eliminar</button></div></div>` : ""}
      <h2>Movimientos</h2>
      ${hist.length ? `<div class="list">${hist.map(logRow).join("")}</div>` : `<div class="panel"><div class="empty">Sin movimientos todavía.</div></div>`}
    </div>`;
    try { if (window.QRCode) new QRCode($("#qrBox"), {text:qrText(t.code), width:264, height:264, correctLevel:QRCode.CorrectLevel.M}); } catch(e){}
    $("#back").onclick = () => { S.toolId = null; render(); };
    $("#editT").onclick = () => needAdmin(() => { S.editTool = {...t}; S.toolId = null; render(); });
    $("#delT").onclick = () => needAdmin(() => { S.toolId = t.id; S.confirmDel = t.id; render(); });
    $("#delNo") && ($("#delNo").onclick = () => { S.confirmDel = null; render(); });
    $("#delYes") && ($("#delYes").onclick = async () => { const r = await act("deleteTool", t.id, S.pin); if (r) { S.confirmDel=null; S.toolId=null; toast("Herramienta eliminada"); } render(); });
    $("#quickMove").onclick = () => move(t);
  }

  /* ---------- perfiles ---------- */
  function renderPeople(){
    const list = S.people.filter(p => inView(p.dept)).sort(byName);
    const unassigned = S.depts.length ? S.people.filter(p => !p.dept).length + S.tools.filter(t => !t.dept).length : 0;
    const depts = S.depts.slice().sort(byName);
    view.innerHTML = `<div class="wrap">
      ${adminPanel()}
      <div class="sectionhead"><h2>Departamentos</h2><button id="addD">+ Departamento</button></div>
      ${depts.length ? `<div class="list">${depts.map(d => {
          const nP = S.people.filter(p => p.dept === d.name).length, nT = S.tools.filter(t => t.dept === d.name).length;
          return `<button class="item" data-dept="${esc(d.id)}"><span class="t">${esc(d.name)}</span><span class="hint">Editar</span>
            <span class="s">${nP} perfil(es) · ${nT} herramienta(s)</span></button>`; }).join("")}</div>`
        : `<div class="notice">Crea los departamentos (por ejemplo: Eléctrico, Mantenimiento) y luego asigna cada perfil y cada herramienta a uno.</div>`}
      ${unassigned ? `<p class="warn">Hay ${unassigned} perfil(es) o herramienta(s) sin departamento. Ábrelos y asígnales uno.</p>` : ""}
      <div class="sectionhead"><h2>Perfiles</h2><button class="primary" id="addP">+ Nuevo perfil</button></div>
      ${deptBar()}
      ${S.people.length ? `<div class="list">${list.map(p => { const n = S.tools.filter(t => t.status==="out" && t.holderId===p.id).length;
        return `<button class="item" data-person="${esc(p.id)}"><span class="t">${esc(p.name)}</span>${n?`<span class="pill out">${n} fuera</span>`:`<span></span>`}
        <span class="s">${deptChip(p.dept)}${esc([p.role,p.phone].filter(Boolean).join(" · ") || "Sin puesto")}</span></button>`; }).join("") || `<div class="empty">Sin perfiles en este departamento</div>`}</div>`
      : `<div class="panel"><div class="empty"><strong>Aún no hay perfiles</strong>Crea un perfil por cada trabajador que toma herramientas.</div></div>`}
    </div>`;
    $("#addD").onclick = () => needAdmin(() => { S.editDept = {}; render(); });
    $("#addP").onclick = () => needAdmin(() => { S.editPerson = { dept: viewDept() }; render(); });
    view.querySelectorAll("[data-person]").forEach(b => b.onclick = () => needAdmin(() => { S.editPerson = {...S.people.find(p => p.id === b.dataset.person)}; render(); }));
    view.querySelectorAll("[data-dept]").forEach(b => b.onclick = () => needAdmin(() => { S.editDept = {...S.depts.find(d => d.id === b.dataset.dept)}; render(); }));
    bindDeptBar(); bindAdminPanel();
  }

  function renderDeptForm(){
    const d = S.editDept; const isNew = !d.id;
    view.innerHTML = `<div class="wrap"><form class="panel" id="dForm" novalidate>
      <h2>${isNew ? "Nuevo departamento" : "Editar departamento"}</h2>
      <label class="field"><span>Nombre <b>*</b></span><input id="d-name" value="${esc(d.name||"")}" placeholder="Ej. Eléctrico, Mantenimiento, Plomería"></label>
      ${isNew ? "" : `<p class="hint">Si cambias el nombre, se actualiza en todos sus perfiles y herramientas.</p>`}
      <p class="err" id="d-err" hidden></p>
      <div class="row"><button type="button" id="d-cancel">Cancelar</button><button class="primary" type="submit" id="d-save">${isNew ? "Crear" : "Guardar"}</button></div>
      ${isNew ? "" : `<button type="button" class="danger" id="d-del">Eliminar departamento</button>`}
      ${S.confirmDel === d.id ? `<div class="confirm"><b>¿Eliminar “${esc(d.name)}”?</b><span class="hint">Solo se puede si no tiene perfiles ni herramientas.</span>
        <div class="row"><button type="button" id="dd-no">No</button><button type="button" class="danger" id="dd-yes">Sí, eliminar</button></div></div>` : ""}
    </form></div>`;
    $("#d-cancel").onclick = () => { S.editDept = null; S.confirmDel = null; render(); };
    $("#d-del") && ($("#d-del").onclick = () => { S.confirmDel = d.id; render(); });
    $("#dd-no") && ($("#dd-no").onclick = () => { S.confirmDel = null; render(); });
    $("#dd-yes") && ($("#dd-yes").onclick = async () => { const r = await act("deleteDept", d.id, S.pin); if (r) { S.editDept = null; S.confirmDel = null; toast("Departamento eliminado"); } render(); });
    $("#dForm").onsubmit = async e => {
      e.preventDefault();
      const name = $("#d-name").value.trim();
      if (!name) { const er = $("#d-err"); er.textContent = "Escribe el nombre."; er.hidden = false; $("#d-name").focus(); return; }
      $("#d-save").disabled = true;
      const oldName = d.name;
      const r = await act("saveDept", { id: d.id || "", name }, S.pin);
      if (r) {
        if (oldName && S.deptView === oldName) S.deptView = name;
        S.editDept = null; toast(isNew ? "Departamento creado" : "Departamento guardado"); render();
      } else $("#d-save").disabled = false;
    };
    $("#d-name").focus();
  }
  function renderPersonForm(){
    const p = S.editPerson; const isNew = !p.id;
    const holding = isNew ? [] : S.tools.filter(t => t.status==="out" && t.holderId===p.id);
    view.innerHTML = `<div class="wrap"><form class="panel" id="pForm" novalidate>
      <h2>${isNew?"Nuevo perfil":"Perfil"}</h2>
      <label class="field"><span>Nombre completo <b>*</b></span><input id="p-name" value="${esc(p.name||"")}" placeholder="Ej. Carlos Méndez"></label>
      ${S.depts.length ? `<label class="field"><span>Departamento <b>*</b></span><select id="p-dept">${deptOptions(p.dept ?? "")}</select></label>` : ""}
      <label class="field"><span>Puesto</span><input id="p-role" value="${esc(p.role||"")}" placeholder="Ej. Electricista, Mantenimiento"></label>
      <label class="field"><span>Teléfono</span><input id="p-phone" type="tel" value="${esc(p.phone||"")}" placeholder="Opcional"></label>
      <p class="err" id="p-err" hidden></p>
      <div class="row"><button type="button" id="p-cancel">Cancelar</button><button class="primary" type="submit" id="p-save">${isNew?"Crear perfil":"Guardar"}</button></div>
      ${isNew ? "" : `<button type="button" class="danger" id="p-del">Eliminar perfil</button>`}
      ${S.confirmDel === p.id ? `<div class="confirm"><b>¿Eliminar a ${esc(p.name)}?</b>${holding.length?`<span class="err">Tiene ${holding.length} herramienta(s) fuera.</span>`:""}
        <div class="row"><button type="button" id="pd-no">No</button><button type="button" class="danger" id="pd-yes">Sí, eliminar</button></div></div>` : ""}
    </form>
    ${holding.length ? `<h2>Tiene ahora</h2><div class="list">${holding.map(t => `<button class="item" data-tool="${esc(t.id)}"><span class="t">${esc(t.name)}</span><span class="pill out">${since(t.since)}</span><span class="s mono">S/N ${esc(t.serial)}</span></button>`).join("")}</div>` : ""}
    </div>`;
    bindItems();
    $("#p-cancel").onclick = () => { S.editPerson = null; S.confirmDel = null; render(); };
    $("#p-del") && ($("#p-del").onclick = () => { S.confirmDel = p.id; render(); });
    $("#pd-no") && ($("#pd-no").onclick = () => { S.confirmDel = null; render(); });
    $("#pd-yes") && ($("#pd-yes").onclick = async () => { const r = await act("deletePerson", p.id, S.pin); if (r) { S.editPerson=null; S.confirmDel=null; toast("Perfil eliminado"); } render(); });
    $("#pForm").onsubmit = async e => {
      e.preventDefault();
      const name = $("#p-name").value.trim(), role = $("#p-role").value.trim(), phone = $("#p-phone").value.trim();
      const dept = $("#p-dept") ? $("#p-dept").value : "";
      const er = $("#p-err");
      if (!name) { er.textContent = "Escribe el nombre."; er.hidden = false; $("#p-name").focus(); return; }
      if (S.depts.length && !dept) { er.textContent = "Elige el departamento."; er.hidden = false; $("#p-dept").focus(); return; }
      $("#p-save").disabled = true;
      const r = await act("savePerson", {id: p.id || "", name, role, phone, dept}, S.pin);
      if (r) {
        if (isNew && !activeId()) { ls.set("activeProfile", r.id); S.deptView = null; }
        renderProfileSelect();
        S.editPerson = null; toast(isNew ? "Perfil creado" : "Perfil guardado"); render();
      } else $("#p-save").disabled = false;
    };
  }

  /* ---------- historial ---------- */
  function logRow(l){
    return `<div class="item"><span class="t">${esc(l.toolName)}</span><span class="pill ${l.action==="out"?"out":"in"}">${l.action==="out"?"Salida":"Regreso"}</span>
      <span class="s">${deptChip(l.toolDept)}${esc(l.personName||"—")}${l.personDept && l.toolDept && l.personDept !== l.toolDept ? ` <span class="hint">(de ${esc(l.personDept)})</span>` : ""} · <span style="font-variant-numeric:tabular-nums">${fmt(l.at)}</span></span></div>`;
  }
  function renderLog(){
    const q = S.logFilter.toLowerCase();
    const v = viewDept();
    const list = S.logs.filter(l => (!v || l.toolDept === v || l.personDept === v) && (!q || [l.toolName,l.personName,l.serial].some(x => String(x||"").toLowerCase().includes(q))));
    view.innerHTML = `<div class="wrap"><h2>Historial</h2>
      ${deptBar()}
      <p class="hint">El historial completo queda guardado en la hoja de Google “Historial”. Aquí se muestran los últimos ${Math.min(S.total, 500)} de ${S.total}.</p>
      <input id="logSearch" placeholder="Filtrar por herramienta o persona" value="${esc(S.logFilter)}" aria-label="Filtrar historial">
      ${S.logs.length ? `<div class="list">${list.map(logRow).join("") || `<div class="empty">Sin resultados</div>`}</div>`
        : `<div class="panel"><div class="empty"><strong>Sin movimientos todavía</strong>Cada salida y regreso aparece aquí con fecha, hora y quién lo hizo.</div></div>`}</div>`;
    const si = $("#logSearch"); si.oninput = () => { S.logFilter = si.value; const pos = si.selectionStart; renderLog(); const n = $("#logSearch"); n.focus(); n.setSelectionRange(pos,pos); };
    bindDeptBar();
  }

  render();
  refresh();
})();
</script>
</body>
</html>
